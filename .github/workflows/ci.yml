name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── STAGE 1: Frontend Build & TypeScript Verification ──
  frontend_build:
    name: 1. Frontend Next.js Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Frontend Dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Build Next.js Production App
      run: npm run build
      
    - name: Frontend Build Verification
      run: echo "✅ Stage 1 passed: Frontend compiled with zero errors."

  # ── STAGE 2: Contracts WASM Compilation (Runs after Frontend) ──
  contracts_build:
    name: 2. Soroban Contracts Build (WASM)
    needs: [frontend_build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
        
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Rust & WASM32 Target
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        
    - name: Compile All 7 Soroban Smart Contracts
      run: cargo build --target wasm32-unknown-unknown --release
      
    - name: Validate Compiled WASM Binaries
      run: |
        ls -la target/wasm32-unknown-unknown/release/*.wasm
        echo "✅ Stage 2 passed: All 7 Soroban contracts successfully compiled to release WASM."
        
    - name: Upload Contract Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: soroban-contracts-wasm
        path: contracts/target/wasm32-unknown-unknown/release/*.wasm
        retention-days: 7

  # ── STAGE 3: Contracts Lint & Code Quality (Runs after Contracts Build) ──
  contracts_quality:
    name: 3. Contracts Formatting & Quality
    needs: [contracts_build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
        
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Rust & Components
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        components: rustfmt
        
    - name: Check Rust Code Formatting
      run: cargo fmt -- --check
      
    - name: Contracts Quality Verification
      run: echo "✅ Stage 3 passed: All contracts match strict formatting and quality standards."
