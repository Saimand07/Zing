name: Zing Production CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Frontend Dependencies
      run: npm ci --legacy-peer-deps
      
    - name: Build Next.js
      run: npm run build

  contracts_build:
    name: Contracts Build
    needs: frontend_build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
        
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Rust & WASM Target
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        
    - name: Build Contracts (WASM)
      run: cargo build --target wasm32-unknown-unknown --release
      
    - name: Verify WASM Outputs
      run: ls -la target/wasm32-unknown-unknown/release/*.wasm
        
    - name: Upload Contract Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: soroban-contracts-wasm
        path: contracts/target/wasm32-unknown-unknown/release/*.wasm
        retention-days: 7

  contracts_quality:
    name: Contracts Quality
    needs: contracts_build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
        
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
        
    - name: Check Formatting
      run: cargo fmt -- --check
