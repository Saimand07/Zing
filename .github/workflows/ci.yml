name: Zing CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend_build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm ci --legacy-peer-deps

    - name: Build Next.js
      run: npm run build

  contracts_build:
    name: Contracts Validation & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Rust & WASM Target
      uses: dtolnay/rust-toolchain@stable
      with:
        target: wasm32-unknown-unknown
        components: rustfmt, clippy

    - name: Rust Format Check
      run: cargo fmt --check

    - name: Rust Clippy
      run: cargo clippy -- -D warnings -A unexpected_cfgs

    - name: Run Contract Tests
      run: cargo test

    - name: Build Contracts (WASM)
      run: cargo build --target wasm32-unknown-unknown --release

    - name: Verify WASM Outputs
      run: ls -la target/wasm32-unknown-unknown/release/*.wasm

    - name: Upload Contract Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: soroban-contracts-wasm
        path: contracts/target/wasm32-unknown-unknown/release/*.wasm
        retention-days: 7

  frontend_deploy:
    name: Frontend Deploy (Vercel)
    needs: frontend_build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} || echo "VERCEL_TOKEN not set — skipping deploy"
      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes || echo "VERCEL_TOKEN not set — skipping deploy"

  contracts_deploy:
    name: Contracts Deploy (Stellar Testnet)
    needs: contracts_build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download Contract Artifacts
        uses: actions/download-artifact@v4
        with:
          name: soroban-contracts-wasm
          path: contracts/target/wasm32-unknown-unknown/release/
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Stellar SDK
        run: npm install @stellar/stellar-sdk
      - name: Deploy Contracts to Stellar Testnet
        run: node deploy_launchpad.js
